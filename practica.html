<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exercici — Repàs d'ESO</title>
<link rel="stylesheet" href="css/estil.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script defer src="vendor/katex/katex.min.js"></script>
<script defer src="vendor/katex/contrib/auto-render.min.js"></script>
</head>
<body>
<main class="embolcall" id="main">
  <div class="barra-sup">
    <a href="index.html" class="petit" id="tornar">← Tots els fulls</a>
    <span class="petit apagat" id="situacio"></span>
  </div>

  <section class="targeta">
    <div style="display:flex;gap:.6rem;align-items:center;margin-bottom:.5rem">
      <span class="codi" id="codi"></span>
      <span class="teoria" id="teoria"></span>
    </div>
    <p class="encap" id="encap"></p>
    <div class="enunciat" id="enunciat"></div>
    <figure class="figura-cont" id="figura" hidden></figure>
    <div class="nota" id="nota" hidden></div>

    <div class="pistes" id="pistes" aria-live="polite"></div>

    <div class="accions">
      <button class="btn pista" id="pista">Demana una pista</button>
      <button class="btn" id="mostra">Ja ho tinc, mostra'm les opcions</button>
    </div>

    <div id="zona-resposta" hidden>
      <div class="opcions" id="opcions" role="radiogroup" aria-labelledby="enunciat"></div>
      <div class="accions">
        <button class="btn" id="comprova" disabled>Comprova la resposta</button>
      </div>
    </div>

    <div class="veredicte" id="veredicte" aria-live="polite"></div>
    <div class="accions">
      <button class="btn buit" id="veure" hidden>Mostra la resolució</button>
    </div>
    <div class="resolucio" id="resolucio" aria-live="polite"></div>

    <div class="accions">
      <button class="btn buit" id="anterior">← Anterior</button>
      <button class="btn" id="seguent">Següent exercici →</button>
    </div>
  </section>
</main>
<script>
  window.RE_FULL_ABSENT = function () {
    document.getElementById("main").innerHTML =
      '<p class="cimera">Repàs per començar 1r de batxillerat</p>' +
      '<h1>Aquest full encara no està preparat</h1>' +
      '<p class="apagat" style="margin:.6rem 0 1.4rem">Torna al llistat de fulls.</p>' +
      '<a class="btn" href="index.html">← Tots els fulls</a>';
  };
  /* El número de full es valida abans de fer-lo servir enlloc. Amb
     `document.write` i el paràmetre enganxat en cru, n'hi havia prou amb un
     ?full= que tanqués l'atribut i l'etiqueta per
     injectar JavaScript arbitrari a la pàgina: en un lloc estàtic sense
     comptes la gravetat és baixa, però n'hi havia prou amb un enllaç per
     escriure el localStorage d'un alumne, i el localStorage és el que genera
     el codi que el professorat qualifica. El `document.write` de sota es manté a
     posta; el motiu és a la nota que l'acompanya. */
  var FULL_N = new URLSearchParams(location.search).get("full") || "1";
  if (!/^([1-9]|1[0-2])$/.test(FULL_N)) {
    document.addEventListener("DOMContentLoaded", function () { RE_FULL_ABSENT(); });
  } else {
    /* `document.write` ÉS DELIBERAT, i no s'ha de canviar per createElement
       sense canviar res més. Bloqueja el parseig, i aquí aquest bloqueig fa
       feina: garanteix que `data/fullN.js` s'executi abans que el
       `<script src="js/practica.js">` que ve a continuació al document. Amb
       `document.head.appendChild()` i `async = false` l'ordre només està
       garantit respecte d'altres scripts inserits per codi, no respecte dels
       que ja són al document: practica.js corre primer, es troba
       `window.FULL` buit, surt pel `return` de la primera línia i la pàgina
       queda en blanc. Provat i comprovat amb `tests/test_a11y.js`.

       Per treure'l de debò caldria que els controladors esperessin les dades
       en lloc de donar-les per presents (un `RE_ARRENCA()` que cridés el
       propi data/fullN.js, o `defer` a tot arreu). Val la pena, però és un
       canvi als quatre controladors, no aquí. */
    document.write('<script src="data/full' + FULL_N
      + '.js" onerror="RE_FULL_ABSENT()"><\/script>');
  }
</script>
<script src="js/calendari.js"></script>
<script src="js/teoria.js"></script>
<script src="js/nucli.js"></script>
<script src="js/proves-inicials.js"></script>
<script src="js/diagnostic-dades.js"></script>
<script src="js/codi-taules.js"></script>
<script src="js/codi.js"></script>
<script src="js/codi-ui.js"></script>
<script src="js/practica.js"></script>
</body>
</html>
