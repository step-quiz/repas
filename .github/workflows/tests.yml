# Totes les proves del projecte (tests/executa.sh), també les de l'analitzador,
# que necessiten jsdom (sense jsdom se'n saltarien unes 200) i les del motor, que
# necessiten SymPy.
# S'executa a cada canvi a main, a cada pull request i a mà (Actions → Tests →
# Run workflow). No escriu res al repositori.
# Els commits del bot dels ZIP no el disparen per si sols (regla de GitHub):
# per això unzip-upload.yml el llança després de desar.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proves:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instal·la jsdom i SymPy
        run: |
          npm install --no-save --no-audit --no-fund jsdom
          pip install sympy

      # Si alguna prova falla, les línies que ho diuen surten com a anotacions al
      # resum de l'execució (així es veu què ha fallat sense obrir el registre).
      - name: Proves
        shell: bash
        run: |
          set +e
          sh tests/executa.sh 2>&1 | tee "$RUNNER_TEMP/proves.txt"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E '✗|FAIL|ERROR|Error|Traceback|fallad' "$RUNNER_TEMP/proves.txt" | grep -v ' 0 fallades' | head -20 |
              while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit "$rc"
