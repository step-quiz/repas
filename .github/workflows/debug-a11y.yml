name: debug-a11y
on:
  push:
    branches: [debug-a11y]
jobs:
  d:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund jsdom
      - run: node tests/_debug_a11y.js
