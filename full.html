<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repàs d'ESO</title>
<link rel="stylesheet" href="css/estil.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script defer src="vendor/katex/katex.min.js"></script>
<script defer src="vendor/katex/contrib/auto-render.min.js"></script>
</head>
<body>
<main class="embolcall" id="main">
  <div class="barra-sup">
    <a href="index.html" class="petit">← Tots els fulls</a>
  </div>

  <h1 id="titol-full">Full</h1>
  <p class="apagat petit" id="subtitol-full" style="margin:.35rem 0 1.1rem"></p>

  <div style="margin:0 0 1.15rem">
    <button class="btn gran" id="continua">Continua on ho vas deixar</button>
  </div>

  <h2 style="margin-top:1.4rem">Per blocs</h2>
  <div class="blocs" id="blocs"></div>

  <details class="desplegable">
    <summary>Veure el mapa complet <span class="fletxa">▾</span></summary>
    <h2 class="visualment-ocult">Mapa complet per apartat</h2>
    <p class="petit apagat" id="detall" style="margin:.7rem 0 .3rem"></p>
    <div id="mapa"></div>
    <div class="llegenda">
      <span><i class="cel net"></i>a la primera</span>
      <span><i class="cel pista"></i>amb pista</span>
      <span><i class="cel segon"></i>al segon intent</span>
      <span><i class="cel fallat"></i>fallat</span>
      <span><i class="cel vist"></i>començat</span>
      <span><i class="cel"></i>per fer</span>
    </div>
  </details>
</main>
<script>
  window.RE_FULL_ABSENT = function () {
    document.getElementById("main").innerHTML =
      '<p class="cimera">Repàs per començar 1r de batxillerat</p>' +
      '<h1>Aquest full encara no està preparat</h1>' +
      '<p class="apagat" style="margin:.6rem 0 1.4rem">Encara no hi ha preguntes ' +
      'per a aquest full. Torna més endavant o tria\'n un altre.</p>' +
      '<a class="btn" href="index.html">← Tots els fulls</a>';
  };
  /* El número de full es valida abans de fer-lo servir enlloc. Amb
     `document.write` i el paràmetre enganxat en cru, n'hi havia prou amb un
     ?full= que tanqués l'atribut i l'etiqueta per
     injectar JavaScript arbitrari a la pàgina: en un lloc estàtic sense
     comptes la gravetat és baixa, però n'hi havia prou amb un enllaç per
     escriure el localStorage d'un alumne, i el localStorage és el que genera
     el codi que el professorat qualifica. A més, `document.write` bloqueja el
     parseig; amb createElement el full es demana igual i sense aturar-lo. */
  var FULL_N = new URLSearchParams(location.search).get("full") || "1";
  if (!/^([1-9]|1[0-2])$/.test(FULL_N)) {
    document.addEventListener("DOMContentLoaded", function () { RE_FULL_ABSENT(); });
  } else {
    document.write('<script src="data/full' + FULL_N
      + '.js" onerror="RE_FULL_ABSENT()"><\/script>');
  }
</script>
<script src="js/calendari.js"></script>
<script src="js/nucli.js"></script>
<script src="js/proves-inicials.js"></script>
<script src="js/diagnostic-dades.js"></script>
<script src="js/codi-taules.js"></script>
<script src="js/codi.js"></script>
<script src="js/codi-ui.js"></script>
<script src="js/hub.js"></script>
</body>
</html>
