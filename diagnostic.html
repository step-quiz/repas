<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test inicial — Repàs d'ESO</title>
<meta name="description" content="Test curt per saber quins temes de matemàtiques et convé repassar primer.">
<link rel="stylesheet" href="css/estil.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script defer src="vendor/katex/katex.min.js"></script>
<script defer src="vendor/katex/contrib/auto-render.min.js"></script>
</head>
<body>
<main class="embolcall" id="main">
  <div class="barra-sup">
    <a href="index.html" class="petit">← Tots els fulls</a>
    <span class="petit apagat">Test inicial</span>
  </div>

  <p class="cimera">Repàs per començar 1r de batxillerat</p>

  <section id="fase-carrega">
    <h1>Preparant el test…</h1>
  </section>

  <section id="fase-preguntes" hidden>
    <p class="petit apagat" id="progres-test" style="margin:0 0 .3rem"></p>
    <div class="barra" id="barra-test" style="margin-bottom:1.1rem"><i style="width:0%"></i></div>

    <section class="targeta" id="targeta-test">
      <p class="encap" id="encap-test"></p>
      <div class="enunciat" id="enunciat-test"></div>

      <div id="autoavaluacio">
        <p class="petit apagat" style="margin:1.2rem 0 .5rem" id="pregunta-estat">Què en dius?</p>
        <div class="opcions" id="estats-test" role="radiogroup" aria-labelledby="pregunta-estat"></div>
      </div>

      <div id="comprovacio" style="margin-top:1.2rem" hidden></div>
    </section>

    <p class="petit transicio" id="transicio" hidden></p>

    <p class="petit apagat" style="margin-top:1.2rem">
      Si no n'estàs segur, tria igualment la que et sembli: interessa tant el
      que creus com el que et surt.
    </p>
  </section>

  <section id="fase-final" hidden>
    <h1>Ja ho tinc tot</h1>
    <p class="apagat" style="margin-top:.5rem">Preparant el teu resultat…</p>
  </section>
</main>
<script src="js/nucli.js"></script>
<script src="js/proves-inicials.js"></script>
<script src="js/diagnostic-dades.js"></script>
<script src="js/itinerari-dades.js"></script>
<script src="js/diagnostic.js"></script>
</body>
</html>
