<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>El teu resultat — Repàs d'ESO</title>
<link rel="stylesheet" href="css/estil.css">
</head>
<body>
<main class="embolcall" id="main">
  <div class="barra-sup">
    <a href="index.html" class="petit">← Tots els fulls</a>
    <span class="petit apagat">Resultat del test</span>
  </div>

  <p class="cimera">Repàs per començar 1r de batxillerat</p>
  <h1>El teu punt de partida</h1>

  <!-- L'itinerari va aquí, abans de qualsevol explicació: és l'acció que ha
       de fer l'alumne, i tota la resta de la pàgina només la justifica. -->
  <div id="recorregut" style="margin:1rem 0 1.6rem"></div>

  <p class="petit" id="resum-linia" style="margin:0 0 1.2rem"></p>

  <section id="desajust" class="errades"></section>
  <section id="bones" class="errades" style="margin-top:1.2rem"></section>

  <details class="desplegable">
    <summary>Veure les 15 destreses del test <span class="fletxa">▾</span></summary>
    <div class="fulls" id="taula-proves" style="margin-top:.7rem"></div>
    <p class="petit apagat" style="margin-top:.9rem">
      El test no mira tot el que hi ha al lloc: mira 15 destreses clau per
      decidir per on començar. Des del llistat de fulls hi pots arribar a tot.
    </p>
  </details>

  <p class="petit apagat" style="margin-top:2.4rem">
    <button class="btn buit petit" id="refes" style="padding:.3rem .6rem">Refer el test</button>
  </p>
</main>
<script src="js/nucli.js"></script>
<script src="js/proves-inicials.js"></script>
